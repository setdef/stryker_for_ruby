# URL pin. The baseline lives in ruby_quality's config/rubocop.yml and is
# fetched at lint time, so rule changes propagate with no per-repo sync.
# Works in CI and contributor clones (bundler already needs network).

inherit_from:
  - https://raw.githubusercontent.com/Kerrick/ruby_quality/main/config/rubocop.yml

plugins:
  - rubocop-performance
  - rubocop-minitest
  - rubocop-rake
  - rubocop-thread_safety
  - rubocop-packaging
  - rubocop-md
  - rubocop-on-rbs

AllCops:
  # The baseline sets DisabledByDefault: true, and RuboCop refuses both
  # settings at once.
  DisabledByDefault: false
  EnabledByDefault: true
  NewCops: enable
  # The gemspec keeps required_ruby_version at >= 3.3, so Ruby 3.3 and 3.4
  # aren't blocked, and Gemspec/RequiredRubyVersion requires this setting to
  # match it. A 3.3 target also keeps RuboCop from accepting syntax that only
  # Ruby 4.0 parses, so the code still loads on 3.3 and 3.4.
  TargetRubyVersion: "3.3"
  Exclude:
    - "tmp/**/*"
    - "vendor/**/*"
    # Gems that a bundle install puts in the workspace, such as the ones in
    # gemfiles/vendor/bundle. "vendor/**/*" matches only the top-level folder.
    - "**/vendor/bundle/**/*"

Markdown:
  # Lint only code blocks tagged ruby. With autodetection on, rubocop-md
  # parses the console and shell blocks in the docs as Ruby.
  Autodetect: false

Style/EndlessMethod:
  # RDoc misreads the end of an endless method, so the methods after it lose
  # their documentation comments.
  EnforcedStyle: disallow

Layout/EndOfLine:
  # .gitattributes checks every file out with LF on every system. RuboCop's
  # default style, native, expects CRLF on Windows.
  EnforcedStyle: lf

Style/Copyright:
  # The project's files have no copyright headers, and REUSE.toml covers them,
  # so no Ruby file has a notice for this cop to find.
  Enabled: false

Lint/ConstantResolution:
  # RuboCop's docs say enabling this disables Style/RedundantConstantBase.
  Enabled: false

Style/MissingElse:
  # RuboCop's docs say this conflicts with Style/EmptyElse's default style.
  Enabled: false

Markdown/Syntax:
  # Kramdown doesn't know GitHub's alert syntax, which Markdown files may use
  # for warnings, so it reports each "> [!warning]" line as an undefined link.
  # No Markdown satisfies both this cop and those alerts.
  Enabled: false

Style/DataInheritance:
  # The form this cop wants, Foo = Data.define(...) do ... end, is a constant to
  # RDoc: it never sees the methods in the block, so the coverage check doesn't
  # count them. A constant defined in the block also lands in the enclosing
  # namespace. The class form costs one unnamed superclass.
  Enabled: false

Style/Documentation:
  inherit_mode:
    merge:
      - Exclude
  # The documentation of lib/ lives in sig/**/*.rbs, so a class or module in
  # lib/ carries no comment. The docs:placement task fails on one that does.
  Exclude:
    - "lib/**/*.rb"

Style/DocumentationMethod:
  inherit_mode:
    merge:
      - Exclude
  # Same reason as Style/Documentation: lib/'s methods are documented in sig/.
  Exclude:
    - "lib/**/*.rb"
