# mise 2026.8.9 and later trust the configuration that `mise install` and
# `mise exec` load, so a computer that has never trusted this folder runs
# them with no prompt. An older mise stops at the trust prompt or at a key it
# doesn't know, so this is the oldest mise that reads this file.
min_version = "2026.10.11"

[tools]
# The development version of Ruby, which mise builds with ruby-build on Linux
# and macOS. On Windows, mise installs RubyInstaller's builds, and
# RubyInstaller has no 4.1-dev, so Windows gets Ruby 4.0, the oldest Ruby the
# project supports. mise renders the template in a version before it reads it.
ruby = "{% if os() == 'windows' %}4.0{% else %}4.1-dev{% endif %}"
python = "3.14"
pre-commit = "latest"
# mise installs the REUSE tool below with uv, so a computer without pipx can
# install it.
uv = "0.13.10"
# reuse lint checks licensing (rake reuse:lint). charset-normalizer, pure
# Python, detects file encodings without libmagic, which python-magic needs.
"pipx:reuse" = { version = "6.3.0", extras = "charset-normalizer" }
