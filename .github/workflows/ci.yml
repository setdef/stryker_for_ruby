# The gate (`bundle exec rake`) on Ruby 4.0, the oldest Ruby the project
# supports, and on the development version of Ruby, on Linux, macOS, and
# Windows, for every push to trunk, and the tests on the oldest Prism the
# gemspec allows.
# The jobs reach the network only to install pinned tools and gems, and to
# read the shared RuboCop baseline that .rubocop.yml inherits.
name: CI

on:
  push:
    branches: [trunk]
  workflow_dispatch:

# SPDX-SnippetBegin
# SPDX-License-Identifier: MIT
# SPDX-SnippetCopyrightText: 2026 setdef <kerrick@setdef.com>
# SPDX-SnippetComment: From setdef/Proof, .github/workflows/ci.yml, from the permissions block through the env block. This copy adds the commit-named group for reruns and manual runs, drops MISE_RUBY_COMPILE, and adds MISE_DISABLE_TOOLS.
permissions:
  contents: read

# A push never cancels a run in progress. GitHub keeps one run going and one
# waiting in the group, and a newer push replaces only the waiting one, so
# every run that starts finishes, and it covers every commit pushed since the
# run before it started. A red run blames that whole batch, and fast.yml gives
# each push a verdict of its own.
#
# A rerun and a run started by hand are the exception: on trunk each gets a
# group named for its commit. Both join a group anew, and in the shared group
# the next push replaced them while they waited. Agents push all day, so a red
# run could never be put right. A group named for the commit keeps a push's
# waiting run and these runs from replacing each other.
concurrency:
  group: >-
    ${{ github.workflow }}-${{ github.ref }}${{
    (github.ref == 'refs/heads/trunk'
    && (github.event_name == 'workflow_dispatch' || github.run_attempt != '1'))
    && format('-{0}', github.sha) || '' }}
  cancel-in-progress: false

defaults:
  run:
    shell: bash

env:
  # Install exactly what Gemfile.lock locks, or fail.
  BUNDLE_FROZEN: "true"
  # ruby/setup-ruby installs the Ruby for each job, so mise leaves out the Ruby
  # that mise.toml pins.
  MISE_DISABLE_TOOLS: ruby
# SPDX-SnippetEnd

jobs:
  gate:
    name: Gate on Ruby ${{ matrix.ruby }}, ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        # head is the development version of Ruby, the version that mise.toml
        # lists as 4.1-dev. ruby/setup-ruby offers every one of these versions
        # on Windows, head included.
        ruby: ["4.0", head]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: ruby/setup-ruby@145243922b4465b78e04dd66294782c7de45901f # v1.345.0
        with:
          ruby-version: ${{ matrix.ruby }}

      # mise.toml pins the other tools contributors use: the REUSE tool and
      # pre-commit. CI installs the same pins.
      - uses: jdx/mise-action@82a612c5ab8bcda7cc5db6b7e81a8e7584c3dc6e # v5.2.3
        with:
          version: 2026.10.11

      - name: Install the bundle
        run: bundle install

      - name: Run the gate
        run: bundle exec rake

  # The gemspec allows prism >= 1.7, and the gate runs on the Prism that
  # Gemfile.lock locks. This job runs the tests on Prism 1.7.0, which
  # gemfiles/prism_1_7.gemfile pins with a lockfile of its own. Ruby 4.0 is the
  # oldest supported Ruby, and its syntax needs Prism 1.7. Nothing in the
  # tests depends on the operating system, so one system is enough.
  prism-floor:
    name: Tests on Prism 1.7.0, Ruby 4.0
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      BUNDLE_GEMFILE: gemfiles/prism_1_7.gemfile
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: ruby/setup-ruby@145243922b4465b78e04dd66294782c7de45901f # v1.345.0
        with:
          ruby-version: "4.0"

      - name: Install the bundle
        run: bundle install

      - name: Check the Prism version
        run: |
          bundle exec ruby -rprism -e 'abort("Prism #{Prism::VERSION}, not 1.7.0") unless Prism::VERSION == "1.7.0"'

      - name: Run the tests
        run: bundle exec rake test:ruby
